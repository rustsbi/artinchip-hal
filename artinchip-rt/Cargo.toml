[package]
name = "artinchip-rt"
version = "0.0.0"
edition = "2024"
authors = [
    "Zhouqi Jiang <luojia@openatom.club>",
    "Chongbing Yu <nanahigh@openatom.club>",
]

[dependencies]
artinchip-rt-macros = { version = "0.0.0", path = "macros" }
artinchip-hal = { version = "0.0.0", path = "../artinchip-hal" }
embedded-hal = "1.0.0"
embedded-time = "0.12.1"
riscv = { version = "0.16.1", features = ["critical-section-single-hart"] }
paste = "1.0"
xuantie-riscv = { git = "https://github.com/rustsbi/xuantie.git", branch = "main" }
log = { version = "0.4", default-features = false }

[features]
interrupts = []
app = []
d12x = []
d13x = []
d21x = []
g73x = []
m6800 = []

[package]
name = "aicfwc"
description = "ArtInChip firmware converter"
version = "0.0.0"
edition = "2024"
authors = [
    "Zhouqi Jiang <luojia@openatom.club>",
    "Chongbing Yu <nanahigh@openatom.club>",
]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"], optional = true }
md-5 = { version = "0.11.0", optional = true }

[features]
default = ["cli"]
cli = ["dep:clap", "dep:md-5"]

[[bin]]
name = "aicfwc"
path = "src/main.rs"
required-features = ["cli"]

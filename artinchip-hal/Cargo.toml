[package]
name = "artinchip-hal"
version = "0.0.0"
edition = "2024"
authors = [
    "Zhouqi Jiang <luojia@openatom.club>",
    "Chongbing Yu <nanahigh@openatom.club>",
]

[dependencies]
volatile-register = "0.2.2"
uart16550 = "0.0.1"
embedded-hal = "1.0.0"
embedded-storage = "0.3"
embedded-time = "0.12.1"
embedded-io = "0.7.1"
embedded-io-async = { version = "0.7.0", optional = true }
riscv = { version = "0.16.1", features = ["critical-section-single-hart"] }
critical-section = "1.2.0"
embassy-sync = { version = "0.8.0", optional = true }
# Disable default features so `embassy-usb` does not pull `usbd-hid`.
embassy-usb = { version = "0.6.0", default-features = false, optional = true }
embassy-usb-driver = { version = "0.2.2", optional = true }
embassy-futures = { version = "0.1.2", optional = true }
xuantie-riscv = { git = "https://github.com/rustsbi/xuantie.git", rev = "b0837ce0dd373481f70deab30fb139da7f8cae06" }
plic = "0.0.2"
log = { version = "0.4", default-features = false }
heapless = "0.9.3"

[features]
uart-logger = []
interrupts = ["dep:embassy-sync", "dep:embedded-io-async"]
async-usb = ["interrupts", "dep:embassy-usb", "dep:embassy-usb-driver", "dep:embassy-futures"]
d12x = []
d13x = []
d21x = []
g73x = []
m6800 = []

[package]
name = "app-bootloader"
version = "0.1.0"
edition = "2024"

[dependencies]
artinchip-hal = { version = "0.0.0", path = "../../../artinchip-hal" }
artinchip-rt = { version = "0.0.0", path = "../../../artinchip-rt", default-features = false, features = ["interrupts"] }
embassy-futures = "0.1.2"
embedded-hal = "1.0.0"
log = { version = "0.4", default-features = false }

[build-dependencies]
aicfwc = { version = "0.0.0", path = "../../../aicfwc", default-features = false }

[features]
default = ["d13x", "nor"]
logger = ["artinchip-hal/uart-logger"]
nor = []
nand = []
quad = []
dma = []
d13x = [
    "artinchip-rt/d13x",
    "artinchip-hal/async-usb",
    "logger",
]
d21x = [
    "artinchip-rt/d21x",
    "artinchip-hal/async-usb",
    "logger",
]

[package]
name = "pbp-common"
version = "0.1.0"
edition = "2024"

[dependencies]
panic-halt = "1.0.0"
embedded-hal = "1.0.0"
artinchip-hal = { version = "0.0.0", path = "../../../artinchip-hal" }
artinchip-rt = { version = "0.0.0", path = "../../../artinchip-rt" }
log = { version = "0.4", default-features = false }
w25qxxxjv = { git = "https://github.com/CosmoBunny/w25qxxxjv.git", branch = "main", default-features = false, features = ["manual_delay"] }

[features]
default = ["d13x"]
logger = ["artinchip-hal/uart-logger"]
d13x = [
    "artinchip-rt/d13x",
    "artinchip-hal/d13x",
    "logger",
]
# TODO other features for all the chips.

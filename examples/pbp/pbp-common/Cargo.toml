[package]
name = "pbp-common"
version = "0.1.0"
edition = "2024"

[dependencies]
panic-halt = "1.0.0"
embedded-hal = "1.0.0"
artinchip-hal = { version = "0.0.0", path = "../../../artinchip-hal", default-features = false }
artinchip-rt = { version = "0.0.0", path = "../../../artinchip-rt", default-features = false }
log = { version = "0.4", default-features = false }

[build-dependencies]
aicfwc = { version = "0.0.0", path = "../../../aicfwc", default-features = false }

[features]
default = ["d13x"]
logger = ["artinchip-hal/uart-logger"]
quad = []
dma = []
d13x = ["artinchip-rt/d13x", "logger"]
d21x = ["artinchip-rt/d21x", "logger"]

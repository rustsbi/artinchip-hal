[package]
name = "pbp-async-uart"
version = "0.1.0"
edition = "2024"

[dependencies]
panic-halt = "1.0.0"
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
embassy-futures = "0.1.2"
heapless = "0.9.3"
artinchip-hal = { version = "0.0.0", path = "../../../artinchip-hal" }
artinchip-rt = { version = "0.0.0", path = "../../../artinchip-rt", default-features = false, features = ["interrupts"] }
log = { version = "0.4", default-features = false }

[features]
default = ["d13x"]
logger = ["artinchip-hal/uart-logger"]
d13x = ["artinchip-rt/d13x", "logger"]
d21x = ["artinchip-rt/d21x", "logger"]

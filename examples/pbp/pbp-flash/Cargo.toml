[package]
name = "pbp-flash"
version = "0.1.0"
edition = "2024"

[dependencies]
panic-halt = "1.0.0"
embedded-hal = "1.0.0"
embedded-storage = "0.3.1"
artinchip-hal = { version = "0.0.0", path = "../../../artinchip-hal" }
artinchip-rt = { version = "0.0.0", path = "../../../artinchip-rt", default-features = false }
log = { version = "0.4", default-features = false }

[features]
default = ["d13x", "nor"]
logger = ["artinchip-hal/uart-logger"]
nor = []
nand = []
quad = []
dma = []
d13x = ["artinchip-rt/d13x", "logger"]
d21x = ["artinchip-rt/d21x", "logger"]

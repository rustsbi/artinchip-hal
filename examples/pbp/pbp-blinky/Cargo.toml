[package]
name = "pbp-blinky"
version = "0.1.0"
edition = "2024"

[dependencies]
panic-halt = "1.0.0"
artinchip-hal = { version = "0.0.0", path = "../../../artinchip-hal" }
artinchip-rt = { version = "0.0.0", path = "../../../artinchip-rt" }
log = { version = "0.4", default-features = false }

[features]
default = ["d13x"]
logger = ["artinchip-hal/uart-logger"]
d13x = ["artinchip-rt/d13x", "artinchip-hal/d13x", "logger"]
d21x = ["artinchip-rt/d21x", "artinchip-hal/d21x", "logger"]
# TODO other features for all the chips.
